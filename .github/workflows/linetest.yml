# (2026-11-26 이전: godsunbi/.github/workflows/linetest.yml) 공개 실행기로 이동 — 체크아웃→실행→godsunbi 로 커밋.
# ⚠ 유료 Gemini 키 사용 — 사용자 허락 후에만 실행.
name: 대사 보이스 테스트
on:
  workflow_dispatch:
    inputs:
      job: {description: "job json 경로", required: false, default: "linetest/job.json"}
permissions:
  contents: read   # 쓰기는 PRIVATE_REPO_TOKEN 으로 godsunbi 에
concurrency: {group: godsunbi-linetest, cancel-in-progress: false}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/godsunbi   # 비공개 저장소 (코드·데이터는 그대로 거기)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .runner                      # 이 저장소(배포·산출물 스크립트)
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_NO_LITE: "1"
        run: python -u apidub/linetest.py --job "${{ inputs.job }}"
      - if: always()
        run: |
          git config user.name hark-bot; git config user.email bot@users.noreply.github.com
          git add linetest; git diff --cached --quiet && exit 0
          git commit -m "linetest 결과"; for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
