# (2026-11-26 이전: godsunbi/.github/workflows/hot-fast.yml) 공개 실행기로 이동 — 코드·데이터는 비공개 godsunbi 에 그대로, 여기선 체크아웃→실행→커밋만.
name: 따라잡기 레이더(2시간)
on:
  # 예약 끔(2026-11-25): 4시간 통합 수집(hot.yml)에 흡수. 수동 실행만.
  # schedule:
  #   - cron: "50 1-23/2 * * *"   # 2시간마다(KST 10:50, 12:50 … 홀수 UTC 시). 후보 영상만 videos.list → 하루 약 12~30유닛
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godsunbi-hot   # hot.yml 과 같은 파일을 쓰므로 같은 그룹
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/godsunbi   # 비공개 저장소 (코드·데이터는 그대로 거기)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .runner                      # 이 저장소(배포·산출물 스크립트)
      - name: 히트 후보 재측정
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ -z "$YT_API_KEY" ]; then echo SKIP=1 >> $GITHUB_ENV; exit 0; fi
          python3 hot/radar.py --fast
          python3 bench/sync_marks.py || true
          python3 bookmarks/sync.py || true   # ⭐ 떡상 북마크(ntfy→bookmarks.json)
      - name: 커밋
        if: env.SKIP != '1'
        run: |
          git config user.name "hot-bot"; git config user.email "hot-bot@users.noreply.github.com"
          git add hot/radar.json bench/marks.json bookmarks/bookmarks.json
          git diff --cached --quiet && echo NOCHG=1 >> $GITHUB_ENV && exit 0
          git commit -m "레이더 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Cloudflare Pages 배포 (초안·대본 원본 제외)
        if: env.SKIP != '1' && env.NOCHG != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .runner/scripts/deploy.sh "$GITHUB_WORKSPACE"
