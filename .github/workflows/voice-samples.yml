# (2026-11-26 이전: godsunbi/.github/workflows/voice-samples.yml) 공개 실행기로 이동 — 체크아웃→실행→godsunbi 로 커밋.
# ⚠ 유료 Gemini 키 사용 — 사용자 허락 후에만 실행.
name: 보이스 비교 Gemini 샘플
run-name: "보이스 비교 Gemini 샘플 [${{ inputs.slots || '전체' }}]"
on:
  workflow_dispatch:
    inputs:
      slots: {description: "슬롯(쉼표, 빈칸=전체 33개)", required: false, default: ""}
      force: {description: "이미 만든 슬롯도 다시 (true/false)", required: false, default: "false"}
      model: {description: "모델 (빈칸=gemini-3.8-flash-tts)", required: false, default: ""}
permissions:
  contents: read
concurrency:
  group: godsunbi-voice-samples
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/godsunbi   # 비공개 저장소 (코드·데이터는 그대로 거기)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .runner                      # 이 저장소(배포·산출물 스크립트)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Gemini 샘플 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          F=""; [ "${{ inputs.force }}" = "true" ] && F="--force"
          python -u apidub/samples.py --slots "${{ inputs.slots }}" --model "${{ inputs.model }}" $F
      - name: voices/gemini 커밋
        if: always()
        run: |
          git config user.name hark-bot; git config user.email bot@users.noreply.github.com
          git add voices/gemini
          git diff --cached --quiet && exit 0
          git commit -m "voices: Gemini 샘플"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Cloudflare Pages 배포 (초안·대본 원본 제외)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .runner/scripts/deploy.sh "$GITHUB_WORKSPACE"
