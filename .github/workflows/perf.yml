# (2026-11-26 이전: godsunbi/.github/workflows/perf.yml) 공개 실행기로 이동 — 코드·데이터는 비공개 godsunbi 에 그대로, 여기선 체크아웃→실행→커밋만.
name: 성과 수집 (수동 백업)
on:
  # 예약 수집은 Cloudflare Worker(godsunbi-perf)로 옮김. 이건 수동 백업용.
  workflow_dispatch:
    inputs:
      analytics:
        description: "상세 지표(Analytics·Reporting)도 수집"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: godsunbi-perf
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/godsunbi   # 비공개 저장소 (코드·데이터는 그대로 거기)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .runner                      # 이 저장소(배포·산출물 스크립트)
      - name: 수집
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ -z "$YT_API_KEY" ]; then echo "::warning::secret YT_API_KEY 가 없어 건너뜀"; echo SKIP=1 >> $GITHUB_ENV; exit 0; fi
          python3 perf/collect.py
      - name: 상세 지표 (하루 1번, KST 03시)
        if: env.SKIP != '1' && (github.event_name != 'workflow_dispatch' || inputs.analytics)
        env:
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_REFRESH_GODSUNBI: ${{ secrets.YT_REFRESH_GODSUNBI }}
          YT_REFRESH_YADAM: ${{ secrets.YT_REFRESH_YADAM }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          if [ "$MANUAL" != "true" ] && [ "$H" != "03" ]; then echo "상세 지표는 03시에만"; exit 0; fi
          if [ -z "$YT_OAUTH_CLIENT_ID" ]; then echo "::warning::OAuth 시크릿이 없어 상세 지표 건너뜀"; exit 0; fi
          python3 perf/analytics.py
      - name: 스튜디오 실시간 지표 (노출·클릭률·평균 시청)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          YT_STUDIO_COOKIE: ${{ secrets.YT_STUDIO_COOKIE }}
        run: |
          if [ -z "$YT_STUDIO_COOKIE" ]; then echo "쿠키 없음 — 건너뜀"; exit 0; fi
          python3 perf/studio.py
      - name: 커밋
        if: env.SKIP != '1'
        run: |
          git config user.name "perf-bot"; git config user.email "perf-bot@users.noreply.github.com"
          git add perf/videos.json perf/history.json perf/analytics.json perf/reach.json perf/studio.json 2>/dev/null || git add perf/videos.json perf/history.json
          git diff --cached --quiet && exit 0
          git commit -m "성과 수집 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Cloudflare Pages 배포 (초안·대본 원본 제외)
        if: env.SKIP != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .runner/scripts/deploy.sh "$GITHUB_WORKSPACE"
