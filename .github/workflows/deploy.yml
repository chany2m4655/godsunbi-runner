# (2026-11-26 이전: godsunbi/.github/workflows/pages.yml) godsunbi.pages.dev 수동 배포.
# 비공개 godsunbi 의 push 트리거([배포] 커밋)는 Free 요금제 분 소진으로 쓰지 않음 → 배포가 필요하면 이 워크플로를 실행.
# (떡상 수집 hot.yml 이 하루 5번 배포할 때도 최신 main 이 함께 올라감)
# 대본 원본(apidub/in/*.txt 등)·코드·작업 폴더는 scripts/deploy-exclude.txt 로 제외.
name: Deploy Cloudflare Pages (godsunbi.pages.dev)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godsunbi-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/godsunbi
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .runner
      - name: Cloudflare Pages 배포 (초안·대본 원본 제외)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .runner/scripts/deploy.sh "$GITHUB_WORKSPACE"
