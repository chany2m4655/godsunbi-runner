# (2026-11-26 이전: godsunbi/.github/workflows/origprobe.yml) 공개 실행기로 이동 — 체크아웃→실행→godsunbi 로 커밋.
name: origprobe
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/godsunbi   # 비공개 저장소 (코드·데이터는 그대로 거기)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .runner                      # 이 저장소(배포·산출물 스크립트)
      - run: bash origdl/probe.sh
