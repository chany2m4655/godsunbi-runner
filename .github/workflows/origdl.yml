# (2026-11-26 이전: godsunbi/.github/workflows/origdl.yml) 공개 실행기로 이동 — 체크아웃→실행→godsunbi 로 커밋.
name: origdl
on:
  workflow_dispatch:
    inputs:
      list: {description: "id 목록 파일", required: true, default: "origdl/ids.txt"}
      shards: {description: "샤드 수", required: true, default: "1"}
permissions: {contents: read}
concurrency: {group: godsunbi-origdl, cancel-in-progress: false}
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.s.outputs.m }}
    steps:
      - id: s
        run: python3 -c "import json;print('m='+json.dumps(list(range(int('${{ inputs.shards }}')))))" >> $GITHUB_OUTPUT
  dl:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/godsunbi   # 비공개 저장소 (코드·데이터는 그대로 거기)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: .runner                      # 이 저장소(배포·산출물 스크립트)
      - run: |
          pip install -q -U yt-dlp
          sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: python3 origdl/run.py "${{ inputs.list }}" ${{ matrix.shard }} ${{ inputs.shards }}
      - name: 결과 저장 (→ godsunbi 'origdl-out' 브랜치, 공개 아티팩트 없음)
        if: always()
        env: {GH_PAT: "${{ secrets.PRIVATE_REPO_TOKEN }}"}
        run: bash .runner/scripts/push_out.sh origdl-out out "${{ github.run_id }}/${{ matrix.shard }}"
